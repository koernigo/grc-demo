# GRC Security Intelligence - Declarative Automation Bundle
# Portable package of the full solution (reference data, synthetic sources, medallion pipeline,
# metric views, Genie space, AI/BI dashboard, SQL alerts, Databricks App).
# Designed to run on Databricks Free Edition (serverless only) as well as any UC-enabled workspace.
bundle:
  name: grc_security_intelligence

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that will hold grc_bronze/grc_silver/grc_gold/grc_ref/grc_synth. Free Edition default is `workspace`.
    default: workspace
  warehouse_name:
    description: Name of the SQL warehouse used by the dashboard, alerts, Genie and the app.
    default: Serverless Starter Warehouse
  warehouse_id:
    description: SQL warehouse ID (looked up from warehouse_name).
    lookup:
      warehouse: ${var.warehouse_name}
  llm_endpoint:
    description: Foundation Model endpoint used by ai_query for control-failure narratives.
    default: databricks-gpt-oss-120b
  as_of_date:
    description: Reporting as-of date for the synthetic story (data window 2026-07-29 .. 2026-10-27).
    default: "2026-10-27"

targets:
  free:
    default: true
    mode: development
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
