# SQL alert (v2). Evaluates daily 07:00 America/New_York, after the 06:00 UTC refresh. Paused by default.
resources:
  alerts:
    ineffective_key_controls:
      display_name: GRC - Key controls rated Ineffective
      query_text: SELECT count(*) AS ineffective_key_controls FROM `${var.catalog}`.grc_gold.control_test_results WHERE key_control AND effectiveness_band = 'Ineffective'
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: ineffective_key_controls
          display: ineffective_key_controls
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: PAUSED
        quartz_cron_schedule: 0 0 7 * * ?
        timezone_id: America/New_York
