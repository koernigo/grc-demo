# 6-page AI/BI dashboard. Dataset queries in the .lvdash.json use unqualified grc_* schema names;
# dataset_catalog points them at ${var.catalog}.
resources:
  dashboards:
    grc_dashboard:
      display_name: GRC Security Intelligence
      file_path: ../src/dashboards/GRC Security Intelligence.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      embed_credentials: true
      # Portability: let the GRC app's service principal see the dashboard so its
      # runtime name-based ID fallback works even when deployed without env vars.
      # (Dashboards use CAN_READ - the API name for the UI's "Can view".)
      permissions:
        - service_principal_name: ${resources.apps.grc_app.service_principal_client_id}
          level: CAN_READ
