# SQL alert (v2). Evaluates daily 07:00 America/New_York, after the 06:00 UTC refresh. Paused by default.
resources:
  alerts:
    expired_exceptions:
      display_name: GRC - Risk exceptions expired but still active
      query_text: SELECT count(*) AS expired_active_exceptions FROM `${var.catalog}`.grc_gold.exception_tracker WHERE tracker_state = 'Expired - Still Active'
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: expired_active_exceptions
          display: expired_active_exceptions
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: PAUSED
        quartz_cron_schedule: 0 0 7 * * ?
        timezone_id: America/New_York
